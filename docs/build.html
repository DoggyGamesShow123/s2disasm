<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sonic 2 — Patch with latest workflow .bps</title>
<style>
  body{margin:0;background:#0e1220;color:#e8edf7;font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial}
  a{color:#9dd6ff;text-decoration:none} a:hover{text-decoration:underline}
  .wrap{max-width:980px;margin:16px auto;padding:0 16px}
  .panel{border:1px solid #223;background:#0f1424;border-radius:14px;padding:12px;margin:12px 0}
  .drop{display:flex;align-items:center;justify-content:center;height:140px;border:2px dashed #2b3a5f;border-radius:14px;background:#0c1222}
  .drop.drag{background:#0a1530;border-color:#3d5aa0}
  .btn{display:inline-block;padding:8px 12px;border-radius:999px;background:#1b2335;border:1px solid #2c3a5a;margin-right:10px}
  .small{font-size:13px;color:#9fb2d0}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h2>Patch once → download <code>s2built.bin</code></h2>
    <p class="small">This page auto‑loads <code>./patches/sonic2.bps</code> (generated by the workflow). Drop a <strong>clean Sonic 2</strong> ROM below.</p>
    <div id="drop" class="drop">Drop clean ROM <strong>.bin</strong> here</div>
    <div style="margin-top:10px">
      <input id="file" type="file" accept=".bin,.md,.smd" />
      <a id="dl" class="btn" download="s2built.bin" style="display:none">Download s2built.bin</a>
      <span id="status" class="small">Fetching patch…</span>
    </div>
    <details style="margin-top:10px"><summary>Details</summary><pre id="details" class="small" style="white-space:pre-wrap"></pre></details>
  </div>
</div>

<script>
const drop = document.getElementById('drop');
const file = document.getElementById('file');
const dl   = document.getElementById('dl');
const statusEl = document.getElementById('status');
const detailsEl= document.getElementById('details');

const toHex = (n,len=8)=>("00000000"+(n>>>0).toString(16)).slice(-len);
const crcTable = (()=>{let c,t=new Uint32Array(256);for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(buf){let crc=0xffffffff;for(let i=0;i<buf.length;i++)crc=crcTable[(crc^buf[i])&0xff]^(crc>>>8);return (crc^0xffffffff)>>>0;}

function readVarInt(p, st){let data=0n,shift=1n,x;while(true){x=BigInt(p[st.i++]);data+=(x&0x7fn)*shift;if(x&0x80n)break;shift<<=7n;data+=shift;}return Number(data);}
function readSigned(p, st){const n=readVarInt(p,st);const neg=(n&1)!==0;const val=n>>>1;return neg?-val:val;}

async function fetchBPS(){
  const res = await fetch('./patches/sonic2.bps', {cache:'no-store'});
  if(!res.ok) throw new Error('Cannot fetch sonic2.bps');
  const ab = await res.arrayBuffer();
  return new Uint8Array(ab);
}

function applyBPS(src, patch){
  // Header BPS1 + decode per spec (actions 0..3)
  if (String.fromCharCode(...patch.slice(0,4))!=='BPS1') throw new Error('Invalid BPS header');
  const st={i:4}; const readV=(p)=>readVarInt(p,st);
  const sourceSize=readV(patch), targetSize=readV(patch), metaSize=readV(patch); st.i+=metaSize;

  const out=new Uint8Array(targetSize);
  let srcPos=0, dstPos=0, srcRel=0, dstRel=0;

  while(dstPos<targetSize){
    const cmd=readV(patch), action=cmd&3, length=(cmd>>>2)+1;
    switch(action){
      case 0: out.set(src.subarray(srcPos, srcPos+length), dstPos); srcPos+=length; dstPos+=length; break;       // SourceRead
      case 1: out.set(patch.subarray(st.i, st.i+length), dstPos);   st.i+=length; dstPos+=length; break;         // TargetRead
      case 2: srcRel+=readSigned(patch,st); out.set(src.subarray(srcRel, srcRel+length), dstPos); dstPos+=length; srcRel+=length; break; // SourceCopy
      case 3: dstRel+=readSigned(patch,st); for(let k=0;k<length;k++) out[dstPos+k]=out[dstRel+k]; dstPos+=length; dstRel+=length; break; // TargetCopy
      default: throw new Error('Bad BPS action');
    }
  }

  const le32 = a => (a[0]|(a[1]<<8)|(a[2]<<16)|(a[3]<<24))>>>0;
  const srcCRCexp = le32(patch.slice(st.i,st.i+4)); st.i+=4;
  const tgtCRCexp = le32(patch.slice(st.i,st.i+4)); st.i+=4;
  const patCRCexp = le32(patch.slice(st.i,st.i+4)); st.i+=4;

  const srcCRC = crc32(src), tgtCRC = crc32(out), patCRC = crc32(patch.subarray(0, patch.length-4));
  const notes=[];
  if (src.length!==sourceSize) notes.push(`Size: expected source ${sourceSize}, got ${src.length}`);
  if (srcCRC!==srcCRCexp)      notes.push(`Source CRC mismatch: expected 0x${toHex(srcCRCexp)}, got 0x${toHex(srcCRC)}`);
  if (tgtCRC!==tgtCRCexp)      notes.push(`Target CRC mismatch: expected 0x${toHex(tgtCRCexp)}, got 0x${toHex(tgtCRC)}`);
  if (patCRC!==patCRCexp)      notes.push(`Patch CRC mismatch: expected 0x${toHex(patCRCexp)}, got 0x${toHex(patCRC)}`);
  return { out, notes };
}

function handleRom(buf, bps){
  try{
    const src = new Uint8Array(buf);
    const { out, notes } = applyBPS(src, bps);
    const blob = new Blob([out], {type:'application/octet-stream'});
    dl.href = URL.createObjectURL(blob);
    dl.style.display = 'inline-block';
    statusEl.textContent = 'Patched! Click “Download s2built.bin”.';
    const srcCRC = crc32(src), outCRC = crc32(out);
    detailsEl.textContent = `ROM CRC32: 0x${toHex(srcCRC)}\nPatched CRC32: 0x${toHex(outCRC)}\nOutput size: ${out.length}\n` +
      (notes.length? `Warnings:\n- ${notes.join('\n- ')}` : '');
  }catch(err){
    statusEl.textContent = 'Patch failed: '+err.message;
  }
}

function makeDrop(){
  drop.addEventListener('dragenter', e=>{ e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragover',  e=>{ e.preventDefault(); });
  drop.addEventListener('dragleave', e=>{ drop.classList.remove('drag'); });
  drop.addEventListener('drop',      e=>{
    e.preventDefault(); drop.classList.remove('drag');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ()=> handleRom(r.result, window.__bps);
    r.readAsArrayBuffer(f);
  });
  file.addEventListener('change', ()=>{
    const f = file.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ()=> handleRom(r.result, window.__bps);
    r.readAsArrayBuffer(f);
  });
}

(async function main(){
  makeDrop();
  try {
    const bps = await fetchBPS(); window.__bps = bps;
    statusEl.textContent = 'Patch ready. Drop a clean ROM.';
  } catch (e){
    statusEl.textContent = 'Could not fetch sonic2.bps (did the workflow run yet?)';
  }
})();
</script>
</body>
</html>
