on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Build s2built.bin (upstream instructs build.bat or build.lua with Lua 5.3; output is s2built.bin). [6](https://anosh.se/ips/)
      - name: Install Lua 5.3
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3
      - name: Build ROM (s2built.bin)
        run: |
          if [ -f build.lua ]; then lua5.3 build.lua; else echo "build.lua not found"; exit 1; fi
          test -f s2built.bin || (echo "s2built.bin not produced" && exit 1)

      # 2) Decode clean ROM from GitHub Secret (never commit ROM)
      - name: Restore clean ROM from secret
        env:
          BASE_ROM_B64: ${{ secrets.BASE_ROM_B64 }}
        run: |
          test -n "$BASE_ROM_B64" || (echo "Missing BASE_ROM_B64 secret" && exit 1)
          echo -n "$BASE_ROM_B64" | base64 -d > clean_sonic2.bin
          ls -l clean_sonic2.bin

      # 3) Fetch RomPatcher.js and install deps (used to CREATE BPS; documented in its README). [2](https://github.com/orgs/community/discussions/138832)
      - name: Fetch RomPatcher.js
        run: |
          git clone https://github.com/marcrobledo/RomPatcher.js.git rpjs
          cd rpjs && npm install

      # 4) Create the BPS (clean -> built)
      - name: Create BPS
        run: |
          mkdir -p docs/patches
          node rpjs/index.js create "clean_sonic2.bin" "s2built.bin" --format bps --output "docs/patches/sonic2.bps"
          ls -l docs/patches/sonic2.bps

      # 5) Commit updated patch into docs/patches/
      - name: Commit patch artifact
        run: |
