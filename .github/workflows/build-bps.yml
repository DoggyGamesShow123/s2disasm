# .github/workflows/build-bps.yml
name: Build BPS patch
on:
  push:
    branches: [ main ]
jobs:
  build-bps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Build your s2built.bin (adjust to your repo's build steps)
      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Build s2built.bin
        run: lua5.3 build.lua   # or ./build.bat on Windows runners
      # s2built.bin is now in the repo root (adjust if different)

      # 2) Prepare RomPatcher.js CLI
      - name: Fetch RomPatcher.js
        run: |
          git clone https://github.com/marcrobledo/RomPatcher.js.git rpjs
          cd rpjs && npm install

      # 3) Create the BPS (you must provide the correct clean ROM in repo or as a secret artifact)
      - name: Create BPS
        run: |
          mkdir -p docs/patches
          node rpjs/index.js create "clean_sonic2.bin" "s2built.bin" --format bps --output "docs/patches/sonic2.bps"

      # 4) Commit the patch back to your repo (optional)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/patches/sonic2.bps
          git commit -m "Update sonic2.bps" || echo "No changes"
          git push
